<style>

</style>

<body>
<main>
<header>
 <div><h1>Gridiron Dynasty</h1><div style="opacity:.9">32 teams, 53-man rosters, one league forever.</div></div>
 <div class="st"><div>Season<b id="a"></b></div><div>Players<b id="b"></b></div><div>Last champion<b id="c"></b></div><div>Hall of Fame<b id="d"></b></div></div>
</header>
<nav id="nav"></nav>
<section id="view"></section>
<p style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><button class="btn go" data-a="play" id="play"></button><button class="btn alt" id="reset">Reset league</button></p>
</main>
<script>
(function(){
var FN=["Jalen","Marcus","Devin","Tyrone","Caleb","Isaiah","Mason","Elijah","Trevor","Brandon","Darius","Cole","Landon","Xavier","Jordan","Terrell","Micah","Andre","Colton","Rashad","Gavin","Dante","Tyler","Kendrick"];
var LN=["Johnson","Williams","Carter","Brooks","Hayes","Mitchell","Jefferson","Coleman","Reed","Bennett","Foster","Powell","Sanders","Ward","Price","Hughes","Barnes","Fields","Thompson","Gaines","Dixon","Pierce","Holloway","Whitaker","Boyd","Ramsey","Lawson","Monroe"];
var CI=["Arizona","Atlanta","Baltimore","Buffalo","Carolina","Chicago","Cincinnati","Cleveland","Dallas","Denver","Detroit","Green Bay","Houston","Indianapolis","Jacksonville","Kansas City","Las Vegas","Los Angeles","Los Angeles","Miami","Minnesota","New England","New Orleans","New York","New York","Philadelphia","Pittsburgh","San Francisco","Seattle","Tampa Bay","Tennessee","Washington"];
var NK=["Cardinals","Falcons","Ravens","Bills","Panthers","Bears","Bengals","Browns","Cowboys","Broncos","Lions","Packers","Texans","Colts","Jaguars","Chiefs","Raiders","Chargers","Rams","Dolphins","Vikings","Patriots","Saints","Giants","Jets","Eagles","Steelers","49ers","Seahawks","Buccaneers","Titans","Commanders"];
var POS=[["QB",3],["RB",4],["WR",6],["TE",3],["OL",9],["DL",9],["LB",7],["CB",5],["S",4],["K",1],["P",1],["LS",1]],PI={};POS.forEach(function(g,i){PI[g[0]]=i});
var U={QB:[1,.04],RB:[.6,.3,.12,.05],WR:[1,.85,.65,.3,.1,.05],TE:[1,.4,.1],OL:[1,1,1,1,1,.4,.2,.1,.05],DL:[1,.95,.9,.8,.4,.3,.15,.1,.05],LB:[1,.95,.8,.5,.3,.15,.1],CB:[1,.95,.75,.35,.15],S:[1,.9,.45,.15],K:[1],P:[1],LS:[0]};
var SW={QB:[3.2],RB:[.8],WR:[.7,.6,.5],TE:[.5],OL:[.7,.7,.7,.7,.7],DL:[.9,.8,.8,.7],LB:[.6,.5,.5],CB:[.7,.6,.5],S:[.6,.5],K:[.4],P:[.2]},SWS=0;
for(var k in SW)SW[k].forEach(function(w){SWS+=w});
var PV={QB:6,RB:0,WR:2,TE:0,OL:1,DL:2,LB:0,CB:1,S:0,K:-14,P:-16,LS:-30};
var ST=[["py","Pass yards","pass yds"],["pt","Pass TD","pass TD"],["pi","Interceptions thrown","INT thrown"],["ry","Rush yards","rush yds"],["rt","Rush TD","rush TD"],["rc","Receptions","rec"],["rv","Receiving yards","rec yds"],["rtd","Receiving TD","rec TD"],["sk","Sacks","sacks"],["tk","Tackles","tackles"],["di","Interceptions","INT"],["fg","Field goals","FG"]];
var TABS=[["teams","Teams"],["lead","Leaders"],["top","Top 100"],["pls","Players"],["new","Create player"],["hof","Hall of Fame"],["log","Season log"]];
var HOFT=180,S,tab="teams",sc="s",st="py",cf="all",ed=null,sel=null,pl=null,q="";
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(v){return(+v).toLocaleString()}
function T(i){return CI[i]+" "+NK[i]}function Tn(i){return i>=0?NK[i]:"Retired"}
function hf(p){return Math.round(p.av+p.t10*5+p.mvp*12+p.rg*3)}
function fp(id){var a=S.p.concat(S.ret);for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i]}
function sline(s){return ST.filter(function(x){return s[x[0]]}).map(function(x){return fmt(s[x[0]])+" "+x[2]}).join(", ")}
function mk(pos,d,t,rk){var age=rk?rnd(21,23):rnd(21,36),o=rk?52+rnd(0,22):clamp(Math.round(78-d*3.4+rnd(-9,9)+(age<24?-4:0)),42,96);
 return{id:S.nid++,n:FN[rnd(0,FN.length-1)]+" "+LN[rnd(0,LN.length-1)],pos:pos,age:age,ovr:o,pot:clamp(o+(rk?rnd(2,16):age<27?rnd(0,10):0),o,99),t:t,s:{},c:{},L:[],av:0,t10:0,mvp:0,rg:0}}
function fresh(){S={season:1,nid:1,p:[],ret:[],hof:[],tm:[],top:[],log:[],champ:"",rec:{},played:0,prev:{}};
 for(var t=0;t<32;t++){S.tm.push({w:0,l:0,c:0});POS.forEach(function(g){for(var i=0;i<g[1];i++)S.p.push(mk(g[0],i,t))})}}
function load(){try{var r=localStorage.getItem("gdyn1");if(r){S=JSON.parse(r);if(S&&S.p)return}}catch(e){}fresh()}
function save(){try{localStorage.setItem("gdyn1",JSON.stringify(S))}catch(e){}}
function gstat(p,u){var f=p.ovr/80,g=f*f,s={};function z(x){return Math.round(x*u*(.8+Math.random()*.4))}function h(x){return Math.round(x*u*(.7+Math.random()*.6)*2)/2}
 switch(p.pos){case"QB":s.py=z(4300*g);s.pt=z(29*g);s.pi=z(12/g);s.ry=z(260*f);s.rt=z(3.5*g);break;
 case"RB":s.ry=z(1700*g);s.rt=z(13*g);s.rc=z(35*f);s.rv=z(260*f);s.rtd=z(1.5*f);break;
 case"WR":s.rc=z(85*f);s.rv=z(1150*g);s.rtd=z(8*g);break;
 case"TE":s.rc=z(62*f);s.rv=z(720*g);s.rtd=z(5.5*g);break;
 case"DL":s.sk=h(10*g);s.tk=z(48*f);break;
 case"LB":s.tk=z(115*f);s.sk=h(5*g);s.di=z(1.6*f);break;
 case"CB":s.di=z(3.8*g);s.tk=z(58*f);break;
 case"S":s.di=z(3.2*g);s.tk=z(78*f);break;
 case"K":s.fg=z(30*g)}
 return s}
function avf(p,s,u){var x=0;switch(p.pos){case"QB":x=s.py/400+s.pt*.6-s.pi*.5+s.ry/200;break;case"RB":x=s.ry/150+s.rt*.6+s.rv/150;break;case"WR":case"TE":x=s.rv/100+s.rtd*.6;break;case"DL":x=s.sk*1.2+s.tk/25;break;case"LB":x=s.tk/18+s.sk+s.di*2;break;case"CB":x=s.di*2.5+s.tk/20;break;case"S":x=s.di*2.5+s.tk/22;break;case"K":x=s.fg/3;break;case"P":x=5*u;break;case"OL":x=u*(p.ovr-45)/4.5}return Math.max(0,x)}
function win(a,b,str){return Math.random()<1/(1+Math.exp((str[b]-str[a])/3))}
function play(){
 var N=32,by=[],str=[],i,g,k,pos,yr=S.season;
 for(i=0;i<N;i++){by.push({});S.tm[i]={w:0,l:0,c:0}}
 S.p.forEach(function(p){(by[p.t][p.pos]=by[p.t][p.pos]||[]).push(p)});
 for(i=0;i<N;i++){var tot=0;for(pos in by[i])by[i][pos].sort(function(a,b){return b.ovr-a.ovr});
  for(pos in SW)SW[pos].forEach(function(w,j){var x=by[i][pos]&&by[i][pos][j];tot+=w*(x?x.ovr:40)});str[i]=tot/SWS}
 for(g=0;g<17;g++){var o=[];for(i=0;i<N;i++)o.push(i);o.sort(function(){return Math.random()-.5});
  for(k=0;k<N;k+=2){var a=o[k],b=o[k+1],aw=win(a,b,str);S.tm[aw?a:b].w++;S.tm[aw?b:a].l++}}
 var sd=[],rk={};for(i=0;i<N;i++)sd.push(i);sd.sort(function(a,b){return S.tm[b].w-S.tm[a].w||str[b]-str[a]});
 sd.forEach(function(t,j){rk[t]=j;S.tm[t].po=j<16});
 var f=sd.slice(0,16);while(f.length>1){var nx=[],n=f.length;for(k=0;k<n/2;k++){var a=f[k],b=f[n-1-k];nx.push(win(a,b,str)?a:b)}f=nx.sort(function(a,b){return rk[a]-rk[b]})}
 var ch=f[0];S.tm[ch].c=1;
 var all=[];
 for(i=0;i<N;i++)for(pos in by[i])by[i][pos].forEach(function(p,d){var u=(U[p.pos]||[])[d]||0,s=gstat(p,u),a=avf(p,s,u);p.s=s;for(var key in s)p.c[key]=(p.c[key]||0)+s[key];p.av+=a;if(p.t===ch)p.rg++;p.L.push({y:yr,t:p.t,o:p.ovr,s:s,a:Math.round(a)});p.sc=p.ovr+(PV[p.pos]||0)+Math.min(8,a/3);all.push(p)});
 all.sort(function(a,b){return b.sc-a.sc});
 var np={};all.slice(0,100).forEach(function(p,j){np[p.id]=j+1;if(j<10)p.t10++;if(j===0)p.mvp++});
 S.top=all.slice(0,100).map(function(p){return{id:p.id,n:p.n,pos:p.pos,t:p.t,age:p.age,o:p.ovr,sc:Math.round(p.sc*10)/10,pv:S.prev[p.id]||0}});S.prev=np;
 ST.forEach(function(x){var kk=x[0],c=S.p.filter(function(p){return p.s[kk]>0}).sort(function(a,b){return b.s[kk]-a.s[kk]}).slice(0,10).map(function(p){return{n:p.n,pos:p.pos,t:p.t,y:yr,v:p.s[kk]}});S.rec[kk]=(S.rec[kk]||[]).concat(c).sort(function(a,b){return b.v-a.v}).slice(0,10)});
 var lines=[],hofs=[],nret=0,keep=[],best=all[0];
 S.p.forEach(function(p){var a=p.age,d;if(a<=25)d=rnd(0,1+Math.ceil((p.pot-p.ovr)/4));else if(a<=29)d=rnd(-1,1);else if(a<=33)d=-rnd(0,2);else d=-rnd(1,3);
  p.ovr=clamp(p.ovr+d,35,d>0?Math.max(p.pot,p.ovr):99);p.age=a+1;a=p.age;
  var c=a>=40?1:a===39?.75:a===38?.55:a===37?.35:0;
  if(Math.random()<c){nret++;p.ry=yr;p.lt=p.t;p.t=-1;var ind=hf(p)>=HOFT&&!p.inh;if(ind){p.inh=1;S.hof.push(p);hofs.push(esc(p.n))}S.ret.push(p);
   if((p.ovr>=72||ind)&&lines.length<25)lines.push(esc(p.n)+" ("+p.pos+", "+NK[p.lt]+") retired at "+a+(ind?' <span class="up">and was inducted into the Hall of Fame</span>':"")+".")}else keep.push(p)});
 S.p=keep;
 var cnt={},nr=0;S.p.forEach(function(p){var kk=p.t+p.pos;cnt[kk]=(cnt[kk]||0)+1});
 for(i=0;i<N;i++)POS.forEach(function(g){for(var j=cnt[i+g[0]]||0;j<g[1];j++){S.p.push(mk(g[0],j,i,1));nr++}});
 S.log.unshift({y:yr,ch:T(ch),rec:S.tm[ch].w+"-"+S.tm[ch].l,mvp:best.n+" ("+best.pos+", "+NK[best.t]+")",lines:lines,hofs:hofs,nret:nret,nr:nr});
 S.champ=NK[ch];S.played=yr;S.season++;save();render()}
function tbl(h,r){return'<div class="scroll"><table><tr>'+h.map(function(x){return'<th>'+x+'</th>'}).join('')+'</tr>'+r.map(function(x){return'<tr>'+x.map(function(c){return'<td>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</table></div>'}
function btn(a,v,t){return'<button class="lnk" data-a="'+a+'" data-v="'+v+'">'+t+'</button>'}
function pbtn(p){return btn('pl',p.id,esc(p.n))}
function chips(list,cur,a){return'<div>'+list.map(function(x){return'<button class="btn'+(cur===x[0]?'':' alt')+'" data-a="'+a+'" data-v="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>'}
function teamsV(){
 if(sel===null){var o=S.tm.map(function(x,i){return i}).sort(function(a,b){return S.tm[b].w-S.tm[a].w});
  return(S.played?'<p class="mu">Season '+S.played+' standings. Click a team for its 53-man roster.</p>':'<p class="mu">Play a season to see standings. Click a team for its 53-man roster.</p>')+tbl(['Team','W','L','Result'],o.map(function(i){var x=S.tm[i];return[btn('team',i,T(i)),x.w,x.l,x.c?'<b>Champion</b>':x.po?'Playoffs':'']}))}
 var ros=S.p.filter(function(p){return p.t===sel}).sort(function(a,b){return PI[a.pos]-PI[b.pos]||b.ovr-a.ovr});
 return'<p>'+btn('back','','← All teams')+'</p><h3>'+T(sel)+' ('+ros.length+' players)</h3>'+tbl(['Pos','Name','Age','Ovr','Pot','Last season'],ros.map(function(p){return[p.pos,pbtn(p),p.age,p.ovr,p.pot,sline(p.s)]}))}
function leadV(){
 var h=chips([["s","This season"],["c","Career (all-time)"],["r","Single-season records"]],sc,"sc")+(sc==="c"?chips([["all","All players"],["act","Active only"],["ret","Retired only"]],cf,"cf"):"")+chips(ST.map(function(x){return[x[0],x[1]]}),st,"st"),lab=ST.filter(function(x){return x[0]===st})[0][1],hd,rows;
 if(sc==="r"){hd=["#","Player","Pos","Year","Team",lab];rows=(S.rec[st]||[]).map(function(r,i){return[i+1,esc(r.n),r.pos,"Season "+r.y,Tn(r.t),fmt(r.v)]})}
 else if(sc==="s"){hd=["#","Player","Pos","Team","Age",lab];rows=S.p.filter(function(p){return p.s[st]>0}).sort(function(a,b){return b.s[st]-a.s[st]}).slice(0,15).map(function(p,i){return[i+1,pbtn(p),p.pos,Tn(p.t),p.age,fmt(p.s[st])]})}
 else{hd=["#","Player","Pos","Status","Age",lab+" (career)"];rows=(cf==="act"?S.p:cf==="ret"?S.ret:S.p.concat(S.ret)).filter(function(p){return p.c[st]>0}).sort(function(a,b){return b.c[st]-a.c[st]}).slice(0,15).map(function(p,i){return[i+1,pbtn(p),p.pos,p.t>=0?Tn(p.t):p.inh?"Hall of Fame":"Retired",p.age,fmt(p.c[st])]})}
 return h+(rows.length?tbl(hd,rows):'<div class="empty">Play a season to see stats.</div>')}
function topV(){if(!S.top.length)return'<div class="empty">Play a season to see the top 100 players.</div>';
 return'<p class="mu">Rank is overall rating plus position value plus production. It is recalculated every season.</p>'+tbl(["#","Player","Pos","Team","Age","Ovr","Score","Move"],S.top.map(function(p,i){var m=S.played<2?"—":p.pv?(p.pv>i+1?'<span class="up">▲'+(p.pv-i-1)+'</span>':p.pv<i+1?'<span class="dn">▼'+(i+1-p.pv)+'</span>':"—"):"New";return[i+1,btn("pl",p.id,esc(p.n)),p.pos,Tn(p.t),p.age,p.o,p.sc,m]}))}
function res(){var s=q.toLowerCase().trim(),l=S.p.concat(S.ret).filter(function(p){return!s||(p.n+" "+p.pos+" "+(p.t>=0?T(p.t):"retired")).toLowerCase().indexOf(s)>=0}).sort(function(a,b){return b.ovr-a.ovr}).slice(0,30);
 return tbl(["Name","Pos","Team","Age","Ovr","Career AV"],l.map(function(p){return[pbtn(p),p.pos,p.t>=0?Tn(p.t):"Retired",p.age,p.ovr,Math.round(p.av)]}))}
function plsV(){return'<input id="q" placeholder="Search by name, position or team" value="'+esc(q)+'" style="width:100%;margin-bottom:10px"><div id="res">'+res()+'</div>'}
function plV(){var p=fp(pl);if(!p)return"";
 return'<p>'+btn("back","","← Back")+' '+btn("edit",p.id,"Edit player")+'</p><h3>'+esc(p.n)+", "+p.pos+'</h3><p class="mu">'+(p.t>=0?T(p.t):p.inh?"Retired, Hall of Fame":"Retired")+", age "+p.age+", overall "+p.ovr+", Hall of Fame points "+hf(p)+'</p><p><b>Career:</b> '+(sline(p.c)||"No stats yet")+'</p>'+(p.L.length?tbl(["Season","Team","Ovr","AV","Stats"],p.L.slice().reverse().map(function(l){return["Season "+l.y,Tn(l.t),l.o,l.a,sline(l.s)]})):'<div class="empty">No seasons played yet.</div>')}
function hofV(){var ap=S.p.concat(S.ret).map(function(p){return[p,hf(p)]}).filter(function(r){return r[1]>0}).sort(function(a,b){return b[1]-a[1]}).slice(0,15);
 return'<p class="mu">Retired players enter the Hall of Fame with '+HOFT+' points: career approximate value, plus 5 per top-10 season, 12 per #1 season and 3 per championship. '+S.ret.length+' players have retired.</p>'+
 (S.hof.length?'<h3>Inductees</h3>'+tbl(["Name","Pos","Class","Seasons","Career AV","Top 10s","#1 seasons","Rings","Points"],S.hof.slice().reverse().map(function(p){return[pbtn(p),p.pos,"Season "+p.ry,p.L.length,Math.round(p.av),p.t10,p.mvp,p.rg,hf(p)]})):'<div class="empty">No inductees yet. Players are inducted when they retire.</div>')+
 '<h3>Hall of Fame points leaders</h3>'+(ap.length?tbl(["#","Player","Pos","Status","Points"],ap.map(function(r,i){var p=r[0];return[i+1,pbtn(p),p.pos,p.t>=0?Tn(p.t):p.inh?"Hall of Fame":"Retired",r[1]]})):'<div class="empty">No points yet.</div>')}
function logV(){return S.log.length?S.log.map(function(e){return'<h3>Season '+e.y+'</h3><p><b>Champion:</b> '+e.ch+' ('+e.rec+'). <b>Best player:</b> '+esc(e.mvp)+'.</p><p class="mu">'+e.nret+' players retired and '+e.nr+' rookies joined.'+(e.hofs.length?' Hall of Fame class: '+e.hofs.join(", ")+'.':'')+'</p><ul>'+e.lines.map(function(l){return'<li>'+l+'</li>'}).join('')+'</ul>'}).join(''):'<div class="empty">Play a season to start the history book.</div>'}
function formV(p){var n=p?p.n:"",pos=p?p.pos:"QB",age=p?p.age:22,o=p?p.ovr:65,pt=p?p.pot:75,t=p?p.t:0,np=!p;
 function opt(v,l,s2){return'<option value="'+v+'"'+(s2?' selected':'')+'>'+l+'</option>'}
 function fld(l,c){return'<label style="display:flex;flex-direction:column;font-size:13px;color:var(--mu);gap:4px">'+l+c+'</label>'}
 return'<h3>'+(np?'Create player':'Edit '+esc(p.n))+'</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px">'+
 fld('Name','<input id="fn" value="'+esc(n)+'" maxlength="40">')+
 fld('Position','<select id="fp">'+POS.map(function(g){return opt(g[0],g[0],g[0]===pos)}).join('')+'</select>')+
 (np||t>=0?fld('Team','<select id="ft">'+CI.map(function(c,i){return opt(i,T(i),i===t)}).join('')+'</select>'):'')+
 fld('Age','<input id="fa" type="number" min="18" max="45" value="'+age+'">')+
 fld('Overall','<input id="fo" type="number" min="35" max="99" value="'+o+'">')+
 fld('Potential','<input id="fq" type="number" min="35" max="99" value="'+pt+'">')+
 '</div><p style="margin-top:12px"><button class="btn go" data-a="savep">'+(np?'Create and sign player':'Save changes')+'</button>'+(np?'':'<button class="btn alt" data-a="cancel">Cancel</button>')+'</p>'+(np?'<p class="mu">The new player joins the team you pick. Rosters can grow past 53 and shrink back as players retire.</p>':'')}
function savep(){var g=function(i){return document.getElementById(i)},p=ed==="new"?null:fp(ed),o=clamp(+g("fo").value||60,35,99);
 if(!p){p=mk(g("fp").value,0,+g("ft").value);S.p.push(p)}
 p.n=g("fn").value.trim()||"Player";p.pos=g("fp").value;p.age=clamp(+g("fa").value||25,18,45);p.ovr=o;p.pot=clamp(Math.max(+g("fq").value||o,o),o,99);
 if(p.t>=0&&g("ft"))p.t=+g("ft").value;
 pl=p.id;ed=null;save();render()}
function render(){
 document.getElementById("a").textContent=S.season;document.getElementById("b").textContent=fmt(S.p.length);document.getElementById("c").textContent=S.champ||"—";document.getElementById("d").textContent=S.hof.length;
 document.getElementById("play").textContent="Play season "+S.season;
 document.getElementById("nav").innerHTML=TABS.map(function(t){return'<button data-t="'+t[0]+'" aria-selected="'+(t[0]===tab&&pl===null)+'">'+t[1]+'</button>'}).join("");
 document.getElementById("view").innerHTML=pl!==null?(ed===pl?formV(fp(pl)):plV()):({teams:teamsV,lead:leadV,top:topV,pls:plsV,"new":function(){return formV(null)},hof:hofV,log:logV})[tab]()}
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var a=b.dataset.a,v=b.dataset.v;
 if(b.dataset.t){tab=b.dataset.t;pl=null;ed=tab==="new"?"new":null;if(tab==="teams")sel=null;render();return}
 if(b.id==="reset"){if(b.dataset.armed){fresh();tab="teams";sel=null;pl=null;save();render();b.textContent="Reset league";delete b.dataset.armed}else{b.dataset.armed="1";b.textContent="Click again to erase everything";setTimeout(function(){b.textContent="Reset league";delete b.dataset.armed},4000)}return}
 if(a==="play")play();else if(a==="team"){sel=+v;render()}else if(a==="back"){if(pl!==null){pl=null;ed=null}else sel=null;render()}
 else if(a==="pl"){pl=+v;render()}else if(a==="sc"){sc=v;render()}else if(a==="st"){st=v;render()}else if(a==="cf"){cf=v;render()}else if(a==="edit"){pl=+v;ed=+v;render()}else if(a==="cancel"){ed=null;render()}else if(a==="savep")savep()});
document.addEventListener("input",function(e){if(e.target.id==="q"){q=e.target.value;document.getElementById("res").innerHTML=res()}});
load();render();
})();
</script>
</body>
</html>
